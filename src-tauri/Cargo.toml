[package]
name = "spark-desktop"
version = "0.1.0"
description = "A minimal Windows desktop shell for Gemini Spark"
authors = ["NAS"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "spark_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
