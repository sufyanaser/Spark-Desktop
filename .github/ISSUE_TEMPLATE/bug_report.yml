name: Bug report
description: Report a reproducible Spark Desktop failure.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include Google credentials, cookies, session tokens, or private information.
  - type: input
    id: version
    attributes:
      label: Spark Desktop version
      placeholder: v0.1.3
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options: [Launch, Sign-in or session, Tabs, Multiple windows, Google Docs or Sheets, Theme, Automatic update, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Numbered steps that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and safe logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I installed Spark Desktop from this repository's GitHub Releases page.
          required: true
        - label: I removed credentials, cookies, tokens, and private data from this report.
          required: true
