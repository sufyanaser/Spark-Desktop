name: Bug report
description: Report a reproducible Spark Desktop problem
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include private Google account, document, prompt, or credential data.
  - type: input
    id: version
    attributes:
      label: Spark Desktop version
      placeholder: e.g. 0.1.3
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gemini Spark tab
        - Google Docs / Sheets tab
        - Tabs / windows
        - Window controls
        - Session / sign-in
        - Automatic updater
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the shortest reliable sequence.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Does the same Google workflow work in a normal browser?
      options:
        - Yes
        - No
        - Not tested
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private account, document, prompt, token, and credential information from this report.
          required: true
