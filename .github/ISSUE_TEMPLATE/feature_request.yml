name: Feature request
description: Propose an improvement that preserves Spark Desktop's focused product boundary
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Spark Desktop is intentionally not a general-purpose browser. Strong proposals explain the workflow problem before proposing UI or implementation.
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: What desktop workflow is currently difficult or interrupted?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Product boundary
      options:
        - Keeps Spark Desktop focused on Gemini Spark / related Workspace workflows
        - May expand browser-like behavior and needs product review
        - Unsure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — explain simpler alternatives if any.
