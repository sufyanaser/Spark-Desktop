name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify version consistency
        run: npm run verify:versions
      - name: Lint
        run: npm run lint
      - name: Frontend build
        run: npm run build
      - name: Rust check
        working-directory: src-tauri
        run: cargo check
      - name: Build Windows validation installer
        run: npm run tauri build -- --config src-tauri/tauri.validation.conf.json
      - name: Upload Windows validation installer
        uses: actions/upload-artifact@v7
        with:
          name: spark-desktop-windows-validation
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
