name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spark-desktop-release
  cancel-in-progress: false

jobs:
  publish-windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Detect whether this version needs publishing
        id: release_state
        shell: pwsh
        run: |
          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $tag = "v$($package.version)"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            "release_needed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "$tag already exists. This main update does not need a duplicate application release."
          } else {
            "release_needed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "$tag is new. Continuing with the signed application release."
          }

      - name: Existing version — no release required
        if: steps.release_state.outputs.release_needed == 'false'
        shell: pwsh
        run: Write-Host "Repository/main metadata changed without an application version bump; release publishing is intentionally skipped."

      - uses: actions/setup-node@v6
        if: steps.release_state.outputs.release_needed == 'true'
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        if: steps.release_state.outputs.release_needed == 'true'

      - uses: swatinem/rust-cache@v2
        if: steps.release_state.outputs.release_needed == 'true'
        with:
          workspaces: './src-tauri -> target'

      - name: Validate updater configuration
        if: steps.release_state.outputs.release_needed == 'true'
        shell: pwsh
        run: |
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ($config.plugins.updater.pubkey -eq 'REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY') {
            throw 'Updater public key is not configured.'
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'TAURI_SIGNING_PRIVATE_KEY secret is missing.'
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Install frontend dependencies
        if: steps.release_state.outputs.release_needed == 'true'
        run: npm install

      - name: Verify version consistency
        if: steps.release_state.outputs.release_needed == 'true'
        run: npm run verify:versions

      - name: Lint
        if: steps.release_state.outputs.release_needed == 'true'
        run: npm run lint

      - name: Frontend build
        if: steps.release_state.outputs.release_needed == 'true'
        run: npm run build

      - name: Rust check
        if: steps.release_state.outputs.release_needed == 'true'
        working-directory: src-tauri
        run: cargo check

      - name: Build and publish signed Tauri release
        if: steps.release_state.outputs.release_needed == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Spark Desktop v__VERSION__'
          releaseBody: 'Automatic Spark Desktop update release.'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
